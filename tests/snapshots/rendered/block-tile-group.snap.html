<!-- Grouped selectable tiles: a fieldset + legend around real radio inputs.
     The group is the whole point — without it each tile announced as a radio
     button belonging to nothing. -->
<fieldset class="cds--tile-group wp-block-awt-tile-group awt-spacing-05"><legend class="cds--label">Instance size</legend>
<input class="cds--tile-input awt-spacing-05" type="radio" id="awt-tile-{0}" name="instance-size" value="standard" /><label class="cds--tile cds--tile--selectable cds--tile--radio awt-tile--framed wp-block-awt-tile" for="awt-tile-{0}"><span class="cds--tile__checkmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8,1C4.1,1,1,4.1,1,8c0,3.9,3.1,7,7,7s7-3.1,7-7C15,4.1,11.9,1,8,1z M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z"/><path d="M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z" data-icon-path="inner-path" opacity="0"/></svg></span><span class="cds--tile-content">

<h3 class="wp-block-heading awt-spacing-05">Standard</h3>



<p class="awt-spacing-06 wp-block-paragraph">Two cores, 4 GB of memory.</p>

</span></label>

<input class="cds--tile-input awt-spacing-05" type="radio" id="awt-tile-{1}" name="instance-size" value="large" /><label class="cds--tile cds--tile--selectable cds--tile--radio awt-tile--framed wp-block-awt-tile" for="awt-tile-{1}"><span class="cds--tile__checkmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8,1C4.1,1,1,4.1,1,8c0,3.9,3.1,7,7,7s7-3.1,7-7C15,4.1,11.9,1,8,1z M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z"/><path d="M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z" data-icon-path="inner-path" opacity="0"/></svg></span><span class="cds--tile-content">

<h3 class="wp-block-heading awt-spacing-05">Large</h3>



<p class="awt-spacing-06 wp-block-paragraph">Eight cores, 32 GB of memory.</p>

</span></label>
</fieldset>

<!-- A group whose tiles have no value set. This locks in a decision rather than
     just covering a path: the render must emit NO value attribute here. The
     tempting fallback, reusing the generated id, would submit `awt-tile-{2}` — a
     number that changes on every render, so a form would receive unstable
     nonsense that still looked like it worked. -->
<fieldset class="cds--tile-group wp-block-awt-tile-group awt-spacing-05"><legend class="cds--label">Billing period</legend>
<input class="cds--tile-input awt-spacing-05" type="radio" id="awt-tile-{3}" name="billing-period" /><label class="cds--tile cds--tile--selectable cds--tile--radio awt-tile--framed wp-block-awt-tile" for="awt-tile-{3}"><span class="cds--tile__checkmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8,1C4.1,1,1,4.1,1,8c0,3.9,3.1,7,7,7s7-3.1,7-7C15,4.1,11.9,1,8,1z M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z"/><path d="M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z" data-icon-path="inner-path" opacity="0"/></svg></span><span class="cds--tile-content">

<p class="awt-spacing-06 wp-block-paragraph">Monthly</p>

</span></label>

<input class="cds--tile-input awt-spacing-05" type="radio" id="awt-tile-{4}" name="billing-period" /><label class="cds--tile cds--tile--selectable cds--tile--radio awt-tile--framed wp-block-awt-tile" for="awt-tile-{4}"><span class="cds--tile__checkmark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8,1C4.1,1,1,4.1,1,8c0,3.9,3.1,7,7,7s7-3.1,7-7C15,4.1,11.9,1,8,1z M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z"/><path d="M7,11L4.3,8.3l0.9-0.8L7,9.3l4-3.9l0.9,0.8L7,11z" data-icon-path="inner-path" opacity="0"/></svg></span><span class="cds--tile-content">

<p class="awt-spacing-06 wp-block-paragraph">Yearly</p>

</span></label>
</fieldset>
