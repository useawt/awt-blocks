     The group is the whole point — without it each tile announced as a radio
     button belonging to nothing. -->

<!-- A group whose tiles have no value set. This locks in a decision rather than
     just covering a path: the render must emit NO value attribute here. The
     tempting fallback, reusing the generated id, would submit `awt-tile-27` — a
     number that changes on every render, so a form would receive unstable
     nonsense that still looked like it worked. -->

<!-- /wp:paragraph -->
<!-- /wp:awt/tile -->
<!-- /wp:awt/tile-group -->
